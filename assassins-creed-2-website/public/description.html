<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Assassin's Creed II</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo-container"><span class="logo-title">Assassin's Creed II</span></div>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/description.html" class="active">Description</a>
            <a href="/content.html">Content</a>
            <a href="/news.html">News</a>
            <a href="/gallery.html">Gallery</a>
            <a href="/search.html">Search</a>
            <a href="/admin/login.html">Admin</a>
        </nav>
    </header>
    <main class="container">
        <h2 class="section-title">Game Information</h2>
        <div class="card" style="padding: 2rem;">
            <div id="game-info-details">Loading...</div>
        </div>
    </main>
    <footer><p>&copy; 2026 Assassin's Creed II Fan Portal</p></footer>
    <script>
        fetch('/api/game/info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('game-info-details').innerHTML = `
                    <h1>${data.title || "Assassin's Creed II"}</h1>
                    <p><strong>Developer:</strong> ${data.developer || "Ubisoft Montreal"}</p>
                    <p><strong>Publisher:</strong> ${data.publisher || "Ubisoft"}</p>
                    <p><strong>Genre:</strong> ${data.genre || "Action-Adventure, Stealth"}</p>
                    <p><strong>Release Year:</strong> ${data.release_year || "2009"}</p>
                    <p><strong>Platforms:</strong> ${data.platforms || "PC, PS3, Xbox 360, PS4, Xbox One, Switch"}</p>
                    <br>
                    <p>${data.description || "An epic story of family, vengeance, and conspiracy set in Renaissance Italy."}</p>
                `;
            });
    </script>
</body>
</html>
