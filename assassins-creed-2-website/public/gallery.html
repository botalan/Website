<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery - Assassin's Creed II</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo-container"><span class="logo-title">Assassin's Creed II</span></div>
        <nav>
            <a href="/index.html">Home</a>
            <a href="/description.html">Description</a>
            <a href="/content.html">Content</a>
            <a href="/news.html">News</a>
            <a href="/gallery.html" class="active">Gallery</a>
            <a href="/search.html">Search</a>
        </nav>
    </header>
    <main class="container">
        <h2 class="section-title">Renaissance Gallery</h2>
        <div class="cards-grid" id="gallery-grid"></div>
    </main>
    <footer><p>&copy; 2026 Assassin's Creed II Fan Portal</p></footer>
    <script>
        fetch('/api/gallery')
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data)) {
                    document.getElementById('gallery-grid').innerHTML = data.map(item => `
                        <div class="card">
                            <img src="${item.image_url}" class="card-img" alt="${item.title}" onerror="this.src='/images/placeholder.svg'">
                            <div class="card-body">
                                <h3 class="card-title">${item.title}</h3>
                                <p class="card-text">${item.description}</p>
                            </div>
                        </div>
                    `).join('');
                }
            });
    </script>
</body>
</html>
